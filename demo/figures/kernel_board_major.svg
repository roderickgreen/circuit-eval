<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 458" role="img"
     aria-label="Board-major kernel: one thread owns one board, evaluates the hero once to a scalar, then streams villain groups of 32 through the lanes"
     font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>Board-major kernel (equity_holdem_bm.wgsl)</title>
  <defs>
    <marker id="arrB" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L8 4 L0 8 z" fill="#2b3038"/>
    </marker>
  </defs>
  <rect width="780" height="458" fill="#ffffff"/>

  <!-- header -->
  <text x="16" y="30" fill="#2b3038"><tspan font-size="15" font-weight="600">Board-major kernel</tspan><tspan dx="10" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#69727f">equity_holdem_bm.wgsl</tspan></text>
  <text x="16" y="48" font-size="11.5" fill="#69727f">hero hand known -- each thread owns one runout; villain draws stream through the lanes</text>
  <text x="764" y="30" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="10" fill="#69727f">grid: one thread per board</text>

  <!-- storage buffers -->
  <text x="16" y="86" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#2b3038">boards[]</text>
  <g fill="#f2f4f7" stroke="#a5adb8" stroke-width="1">
    <rect x="16" y="92" width="110" height="10"/>
    <rect x="16" y="105" width="110" height="10"/>
    <rect x="16" y="118" width="110" height="10"/>
    <rect x="16" y="131" width="110" height="10"/>
    <rect x="16" y="144" width="110" height="10"/>
  </g>
  <text x="71" y="168" text-anchor="middle" font-size="9.5" fill="#69727f">1 entry / thread</text>

  <text x="16" y="216" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11.5" fill="#2b3038">villains[]</text>
  <g fill="#f6e3d7" stroke="#b06239" stroke-width="1">
    <rect x="16" y="222" width="110" height="10"/>
    <rect x="16" y="235" width="110" height="10"/>
    <rect x="16" y="248" width="110" height="10"/>
    <rect x="16" y="261" width="110" height="10"/>
    <rect x="16" y="274" width="110" height="10"/>
  </g>
  <text x="71" y="298" text-anchor="middle" font-size="9.5" fill="#69727f">32 entries / pass</text>

  <!-- invocation frame -->
  <rect x="150" y="62" width="614" height="300" rx="10" fill="none" stroke="#98a1ad" stroke-width="1.2" stroke-dasharray="6 4"/>
  <text x="162" y="82" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#69727f">ONE INVOCATION (THREAD)</text>

  <!-- hero path: once per board -->
  <path d="M126 123 H146 V110 H166" fill="none" stroke="#2b3038" stroke-width="1.3" marker-end="url(#arrB)"/>
  <rect x="170" y="98" width="96" height="24" rx="4" fill="#f2f4f7" stroke="#a5adb8" stroke-width="1"/>
  <text x="218" y="113.5" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" fill="#2b3038">board bd</text>
  <path d="M266 110 H288" fill="none" stroke="#2b3038" stroke-width="1.3" marker-end="url(#arrB)"/>
  <rect x="292" y="98" width="170" height="24" rx="4" fill="#dce9f6" stroke="#4a7ab0" stroke-width="1"/>
  <text x="377" y="113.5" text-anchor="middle" font-size="10" fill="#2b3038">hero + bd (same in all 32 lanes)</text>
  <path d="M462 110 H484" fill="none" stroke="#2b3038" stroke-width="1.3" marker-end="url(#arrB)"/>
  <rect x="488" y="90" width="140" height="40" rx="6" fill="#fdeecb" stroke="#c9992e" stroke-width="1.6"/>
  <text x="558" y="107" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b3038">hand-rank circuit</text>
  <text x="558" y="121" text-anchor="middle" font-size="9.5" fill="#69727f">runs once per board</text>
  <path d="M628 110 H650" fill="none" stroke="#2b3038" stroke-width="1.3" marker-end="url(#arrB)"/>
  <rect x="654" y="90" width="98" height="40" rx="6" fill="#dce9f6" stroke="#4a7ab0" stroke-width="1.2"/>
  <text x="703" y="107" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="600" fill="#2b3038">hval</text>
  <text x="703" y="121" text-anchor="middle" font-size="9.5" fill="#69727f">24-bit scalar</text>

  <!-- villain loop -->
  <rect x="170" y="160" width="578" height="148" rx="8" fill="#fafbfd" stroke="#a5adb8" stroke-width="1"/>
  <text x="182" y="180" font-size="10" font-weight="600" letter-spacing="0.06em" fill="#69727f">LOOP: VILLAIN LANE-GROUPS OF 32</text>
  <path d="M731 168 A9 9 0 1 0 740 177" fill="none" stroke="#69727f" stroke-width="1.2" marker-end="url(#arrB)"/>

  <path d="M126 253 H160 V244 H186" fill="none" stroke="#2b3038" stroke-width="1.3" marker-end="url(#arrB)"/>
  <rect x="190" y="210" width="140" height="68" rx="6" fill="#f6e3d7" stroke="#b06239" stroke-width="1"/>
  <text x="260" y="230" text-anchor="middle" font-size="11" fill="#2b3038">32 draws -&gt; lanes</text>
  <text x="260" y="246" text-anchor="middle" font-size="10" fill="#69727f">transpose -&gt; planes</text>
  <rect x="202" y="256" width="116" height="13" fill="#ffffff" stroke="#c9cfd8" stroke-width="1"/>
  <g stroke="#c9cfd8" stroke-width="1">
    <line x1="231" y1="256" x2="231" y2="269"/>
    <line x1="260" y1="256" x2="260" y2="269"/>
    <line x1="289" y1="256" x2="289" y2="269"/>
  </g>

  <path d="M330 244 H348" fill="none" stroke="#2b3038" stroke-width="1.3" marker-end="url(#arrB)"/>
  <rect x="352" y="224" width="140" height="40" rx="6" fill="#fdeecb" stroke="#c9992e" stroke-width="1.6"/>
  <text x="422" y="241" text-anchor="middle" font-size="11.5" font-weight="600" fill="#2b3038">hand-rank circuit</text>
  <text x="422" y="256" text-anchor="middle" font-size="9.5" fill="#69727f">bitsliced x 32</text>
  <path d="M492 244 H508" fill="none" stroke="#2b3038" stroke-width="1.3" marker-end="url(#arrB)"/>
  <rect x="512" y="226" width="92" height="36" rx="5" fill="#f6e3d7" stroke="#b06239" stroke-width="1"/>
  <text x="558" y="248" text-anchor="middle" font-size="10" fill="#2b3038">24 value planes</text>
  <path d="M604 244 H626" fill="none" stroke="#2b3038" stroke-width="1.3" marker-end="url(#arrB)"/>

  <rect x="630" y="200" width="104" height="88" rx="6" fill="#f2f4f7" stroke="#a5adb8" stroke-width="1"/>
  <text x="682" y="222" text-anchor="middle" font-size="11" font-weight="600" fill="#2b3038">hval vs planes</text>
  <text x="682" y="238" text-anchor="middle" font-size="9.5" fill="#69727f">scalar-vs-plane</text>
  <text x="682" y="252" text-anchor="middle" font-size="9.5" fill="#69727f">compare (24 bits)</text>
  <text x="682" y="268" text-anchor="middle" font-size="9.5" fill="#69727f">popcount w / t / b</text>

  <!-- hval reuse -->
  <path d="M703 130 V196" fill="none" stroke="#2b3038" stroke-width="1.3" marker-end="url(#arrB)"/>
  <text x="697" y="168" text-anchor="end" font-size="9.5" fill="#69727f">reused every pass</text>

  <!-- tally -->
  <path d="M682 288 V374" fill="none" stroke="#2b3038" stroke-width="1.3" marker-end="url(#arrB)"/>
  <text x="676" y="336" text-anchor="end" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="9.5" fill="#69727f">atomicAdd after loop</text>
  <rect x="616" y="378" width="148" height="44" rx="6" fill="#e6efe6" stroke="#5d8462" stroke-width="1.2"/>
  <text x="690" y="396" text-anchor="middle" font-size="11" font-weight="600" fill="#2b3038">tally: win / tie / deals</text>
  <text x="690" y="411" text-anchor="middle" font-size="9.5" fill="#69727f">one add-set per thread</text>

  <!-- takeaway -->
  <text x="16" y="436" font-size="11.5" fill="#2b3038">Per board: 1 + V/32 circuit evals -- the hero eval is hoisted out of the loop, and every villain eval scores 32 deals.</text>
  <text x="16" y="452" font-size="10.5" fill="#69727f">routed when the runout space is huge (&gt;= 32,768 boards: preflop, early streets); one thread per board underfills small spots.</text>
</svg>
